[project]
name = "projet-ml-ops-prevision-vente"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow==3.16.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
